<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta  name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="g.css">
</head>

<body>
    <form id="Register-form">
        <div>Register</div>
        <div class="container">
            <div class="input-wrapper">
                <label for="firstName">First Name</label>
                <input type="text"  id="firstName">
            </div>
            <div class="input-wrapper">
                <label for="lastName">Last Name</label>
                <input type="text"  id="lastName">
            </div>
        </div>
        <div class="input-wrapper">
            <label for="email">email</label>
            <input type="email"  id="email">
        </div>
        <div class="container">
            <div class="input-wrapper">
                <label for="age">age</label>
                <input type="number"  id="age">
            </div>
            <div>
                <select  id="" id=""></select>
            </div>
        </div>
        <div class="container " >
            <div class="input-wrapper boxes"><label for="male">Male</label>
                <input type="radio" class="box" id="male" id="male">
            </div>
            <div class="input-wrapper boxes"><label for="female">Female</label>
                <input type="radio" class="box" id="female" id="female">
            </div>
        </div>
         <div class="input-wrapper"><label for="password">password</label>
            <input type="password"  id="password"></div>
         <div class="input-wrapper"><label for="confirmpassword">confirm password</label>
            <input type="confirmpassword"  id="confirmpassword"></div> 
        <div class="input-wrapper">
            <input type="checkbox" class="box"  id="accept" id="accept">
            <label for="accept">accept our terms and conditions which applied for 12 years</label>
            </div>
        <div><button type="submit">sign up</button></div>



    </form>

    <script src="g.js"></script>
</body>

</html>
